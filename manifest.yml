# Engram - Atlassian Forge app
# Run `forge register` to populate app.id before deploying.
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/109ae825-f25c-40ae-ad6b-1ac96b4efa6c

modules:
  function:
    - key: resolver
      handler: index.handler

  jira:issuePanel:
    - key: engram-issue-panel
      resource: main
      resolver:
        function: resolver
      title: Engram
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  # Rovo agent + actions added in Day 2
  # rovo:agent: ...

resources:
  - key: main
    path: frontend/dist


permissions:
  scopes:
    - read:jira-work
    - storage:app
