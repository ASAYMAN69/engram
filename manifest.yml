# Engram - Atlassian Forge app
# Run `forge register` to populate app.id before deploying.
app:
  runtime:
    name: nodejs24.x
  id: REPLACE_WITH_FORGE_APP_ID

modules:
  jira:issuePanel:
    - key: engram-issue-panel
      resource: main
      resolver:
        function: resolver
      title: Engram
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

  # Rovo agent + actions added in Day 2
  # rovo:agent: ...

resources:
  - key: main
    path: frontend/dist

function:
  - key: resolver
    handler: index.handler

permissions:
  scopes:
    - read:jira-work
    - storage:app
