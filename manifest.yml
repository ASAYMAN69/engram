# Engram - Atlassian Forge app
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/109ae825-f25c-40ae-ad6b-1ac96b4efa6c

modules:
  function:
    - key: resolver
      handler: index.handler
    - key: extract-decision-fn
      handler: actions/extractDecision.run
    - key: search-decisions-fn
      handler: actions/searchDecisions.run
    - key: check-conflict-fn
      handler: actions/checkConflict.run
    - key: issue-created-fn
      handler: triggers/issueCreated.run

  jira:issuePanel:
    - key: engram-issue-panel
      resource: main
      resolver:
        function: resolver
      title: Engram
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

  trigger:
    - key: engram-issue-created
      function: issue-created-fn
      events:
        - avi:jira:created:issue

  jira:projectPage:
    - key: engram-dashboard
      resource: main
      resolver:
        function: resolver
      title: Engram
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

  rovo:agent:
    - key: engram-agent
      name: Engram
      description: Decision memory assistant for software teams.
      prompt: "resources/engram-prompt.txt"
      actions:
        - extract-decision
        - search-decisions
        - check-conflict

  action:
    - key: extract-decision
      name: extractDecision
      description: Extract a structured decision record from text (unsaved, for confirmation).
      function: extract-decision-fn
      actionVerb: GET
      inputs:
        text:
          title: Text
          description: The text (ticket/page content) to extract a decision from.
          type: string
    - key: search-decisions
      name: searchDecisions
      description: Search past decisions by question; returns matches with source links.
      function: search-decisions-fn
      actionVerb: GET
      inputs:
        question:
          title: Question
          description: The question to search past decisions for.
          type: string
    - key: check-conflict
      name: checkConflict
      description: Check whether a proposed change contradicts an active decision.
      function: check-conflict-fn
      actionVerb: GET
      inputs:
        proposedChange:
          title: Proposed change
          description: The proposed change to check against active decisions.
          type: string

  trigger:
    - key: issue-created-trigger
      function: issue-created-fn
      events:
        - avi:jira:issue:created

resources:
  - key: main
    path: frontend/dist

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
