# Engram - Atlassian Forge app
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/109ae825-f25c-40ae-ad6b-1ac96b4efa6c

modules:
  function:
    - key: resolver
      handler: index.handler
    - key: extract-decision
      handler: src/actions/extractDecision.run
    - key: search-decisions
      handler: src/actions/searchDecisions.run
    - key: check-conflict
      handler: src/actions/checkConflict.run

  jira:issuePanel:
    - key: engram-issue-panel
      resource: main
      resolver:
        function: resolver
      title: Engram
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

  jira:projectPage:
    - key: engram-decision-health
      resource: main
      resolver:
        function: resolver
      title: Decision Health
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

  rovo:agent:
    - key: engram-agent
      name: Engram
      description: Decision memory assistant for software teams.
      prompt:
        resource: engram-prompt
      actions:
        - extract-decision
        - search-decisions
        - check-conflict

  rovo:action:
    - key: extract-decision
      name: extractDecision
      description: Extract a structured decision record from text (unsaved, for confirmation).
      function: extract-decision
      inputs:
        text:
          type: string
          required: true
    - key: search-decisions
      name: searchDecisions
      description: Search past decisions by question; returns matches with source links.
      function: search-decisions
      inputs:
        question:
          type: string
          required: true
    - key: check-conflict
      name: checkConflict
      description: Check whether a proposed change contradicts an active decision.
      function: check-conflict
      inputs:
        proposedChange:
          type: string
          required: true

resources:
  - key: main
    path: frontend/dist
  - key: engram-prompt
    path: resources/engram-prompt.txt

permissions:
  scopes:
    - read:jira-work
    - storage:app
